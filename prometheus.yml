global:
  scrape_interval: 1s
  evaluation_interval: 1s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

rule_files:
  - "rules.yml"

scrape_configs:
  # system metrics (CPU / RAM / disk) from node_exporter
  - job_name: "node"
    static_configs:
      - targets: ["localhost:9100"]

  # application metrics from prometheus_client (separate port)
  - job_name: "python_app"
    static_configs:
      - targets: ["localhost:18000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["localhost:9093"]
